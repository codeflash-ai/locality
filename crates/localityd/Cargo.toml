[package]
name = "localityd"
version = "0.3.6"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
name = "localityd"
path = "src/lib.rs"

[[bin]]
name = "localityd"
path = "src/main.rs"

[dependencies]
locality-core.workspace = true
locality-engine.workspace = true
locality-platform.workspace = true
locality-protocol.workspace = true
locality-store.workspace = true
locality-connector.workspace = true
locality-notion.workspace = true
locality-google-docs.workspace = true
locality-google-calendar.workspace = true
locality-gmail.workspace = true
locality-granola.workspace = true
locality-linear.workspace = true
locality-slack.workspace = true
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["std"] }
getrandom = "0.3"
hmac = "0.12"
notify = "8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tar = { version = "0.4", default-features = false }
caseless.workspace = true
unicode-normalization = { version = "=0.1.25", git = "https://github.com/unicode-rs/unicode-normalization.git", rev = "576ae0b1407dd14854876c93f1a348df0c19dffe" }
zstd = { version = "0.13", default-features = false }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.4", features = ["fs"] }

[target.'cfg(target_vendor = "apple")'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
cap-std = "4.0.2"
windows-sys = { version = "0.61", features = [
  "Wdk_Foundation",
  "Wdk_Storage_FileSystem",
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Storage_FileSystem",
  "Win32_System_IO",
] }

[dev-dependencies]
rusqlite = { version = "0.39.0", features = ["bundled"] }
