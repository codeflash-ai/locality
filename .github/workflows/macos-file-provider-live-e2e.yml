name: macos-file-provider-live-e2e

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Shared with connector-live-e2e to serialize every Slack OAuth consumer.
  group: locality-live-secret-consumers
  cancel-in-progress: false

jobs:
  file-provider-live:
    name: Signed macOS File Provider live Notion e2e
    runs-on: [self-hosted, macOS, locality-file-provider]
    timeout-minutes: 45
    environment: notion-live-e2e
    outputs:
      app_path: ${{ steps.provider-config.outputs.app_path }}
      bundle_id: ${{ steps.provider-config.outputs.bundle_id }}
    env:
      NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
      LOCALITY_NOTION_LIVE_PARENT_PAGE: ${{ secrets.LOCALITY_NOTION_LIVE_PARENT_PAGE || secrets.AFS_NOTION_LIVE_PARENT_PAGE }}
      LOCALITY_MACOS_FILE_PROVIDER_APP: ${{ vars.LOCALITY_MACOS_FILE_PROVIDER_APP || '/Applications/Locality File Provider Test.app' }}
      LOCALITY_MACOS_FILE_PROVIDER_EXPECTED_BUNDLE_ID: ${{ vars.LOCALITY_MACOS_FILE_PROVIDER_BUNDLE_ID || 'ai.codeflash.locality.fileprovidertest' }}
      LOCALITY_PROMPT_TEST_SIGNING_IDENTITY: ${{ vars.LOCALITY_MACOS_FILE_PROVIDER_SIGNING_IDENTITY || secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_SIGNING_IDENTITY: ${{ vars.LOCALITY_MACOS_FILE_PROVIDER_SIGNING_IDENTITY || secrets.APPLE_SIGNING_IDENTITY }}
      LOCALITY_MACOS_FILE_PROVIDER_LIVE: "1"
      LOCALITY_MACOS_FILE_PROVIDER_DEDICATED_HOST: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Import Developer ID certificate
        env:
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          missing=()
          [ -n "$APPLE_CERTIFICATE_P12_BASE64" ] || missing+=("APPLE_CERTIFICATE_P12_BASE64")
          [ -n "$APPLE_CERTIFICATE_PASSWORD" ] || missing+=("APPLE_CERTIFICATE_PASSWORD")
          [ -n "$APPLE_SIGNING_IDENTITY" ] || missing+=("APPLE_SIGNING_IDENTITY")
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Missing macOS signing configuration: ${missing[*]}"
            exit 1
          fi

          keychain_path="${RUNNER_TEMP}/locality-file-provider-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.keychain-db"
          certificate_path="${RUNNER_TEMP}/locality-file-provider-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.p12"
          echo "LOCALITY_SIGNING_KEYCHAIN=${keychain_path}" >> "$GITHUB_ENV"
          trap 'rm -f "$certificate_path"' EXIT

          printf '%s' "$APPLE_CERTIFICATE_P12_BASE64" | base64 --decode > "$certificate_path" 2>/dev/null \
            || printf '%s' "$APPLE_CERTIFICATE_P12_BASE64" | base64 -D > "$certificate_path"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$keychain_path"
          security import "$certificate_path" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -A \
            -t cert \
            -f pkcs12 \
            -k "$keychain_path"
          security list-keychains -d user -s "$keychain_path" $(security list-keychains -d user | tr -d '"')
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$keychain_path"
          security find-identity -v -p codesigning "$keychain_path" | grep -F "$APPLE_SIGNING_IDENTITY"
      - name: Check dedicated runner configuration
        run: |
          missing=()
          [ -n "$NOTION_TOKEN" ] || missing+=("NOTION_TOKEN")
          [ -n "$LOCALITY_NOTION_LIVE_PARENT_PAGE" ] || missing+=("LOCALITY_NOTION_LIVE_PARENT_PAGE or AFS_NOTION_LIVE_PARENT_PAGE")
          [ -n "$LOCALITY_MACOS_FILE_PROVIDER_APP" ] || missing+=("LOCALITY_MACOS_FILE_PROVIDER_APP")
          [ -n "$LOCALITY_MACOS_FILE_PROVIDER_EXPECTED_BUNDLE_ID" ] || missing+=("LOCALITY_MACOS_FILE_PROVIDER_BUNDLE_ID")
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Missing macOS File Provider live configuration: ${missing[*]}"
            exit 1
          fi
          bash -n tests/live_macos_file_provider.sh
          bash -n tests/live_macos_connector_file_provider.sh
          python3 tests/live_connector_matrix.py validate
      - name: Export installed provider configuration
        id: provider-config
        run: |
          echo "app_path=$LOCALITY_MACOS_FILE_PROVIDER_APP" >> "$GITHUB_OUTPUT"
          echo "bundle_id=$LOCALITY_MACOS_FILE_PROVIDER_EXPECTED_BUNDLE_ID" >> "$GITHUB_OUTPUT"
      - name: Install desktop dependencies
        run: npm ci
        working-directory: apps/desktop
      - name: Build current signed-app candidate
        run: make build-tauri
      - name: Install without resetting the approved domain
        run: |
          scripts/install-macos-prompt-test-app.sh \
            --app-path "$LOCALITY_MACOS_FILE_PROVIDER_APP" \
            --bundle-id "$LOCALITY_MACOS_FILE_PROVIDER_EXPECTED_BUNDLE_ID" \
            --display-name "Locality File Provider Test" \
            --no-reset-domain \
            --no-launch
      - name: Run real File Provider round trip
        run: tests/live_macos_file_provider.sh
      - name: Remove temporary signing keychain
        if: ${{ always() }}
        run: |
          if [ -n "${LOCALITY_SIGNING_KEYCHAIN:-}" ]; then
            security delete-keychain "$LOCALITY_SIGNING_KEYCHAIN" 2>/dev/null || true
          fi

  connector-file-provider-live:
    name: Signed macOS Gmail and Linear File Provider live e2e
    needs: file-provider-live
    runs-on: [self-hosted, macOS, locality-file-provider]
    timeout-minutes: 45
    environment: connector-live-e2e
    env:
      LOCALITY_GMAIL_LIVE_CREDENTIAL_JSON: ${{ secrets.LOCALITY_GMAIL_LIVE_CREDENTIAL_JSON }}
      LOCALITY_GMAIL_LIVE_TO_EMAIL: ${{ secrets.LOCALITY_GMAIL_LIVE_TO_EMAIL }}
      LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
      LOCALITY_LINEAR_LIVE_ISSUE_ID: ${{ secrets.LOCALITY_LINEAR_LIVE_ISSUE_ID }}
      LOCALITY_MACOS_FILE_PROVIDER_APP: ${{ needs.file-provider-live.outputs.app_path }}
      LOCALITY_MACOS_FILE_PROVIDER_EXPECTED_BUNDLE_ID: ${{ needs.file-provider-live.outputs.bundle_id }}
      LOCALITY_MACOS_CONNECTOR_FILE_PROVIDER_LIVE: "1"
      LOCALITY_MACOS_FILE_PROVIDER_DEDICATED_HOST: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Run real Gmail File Provider draft scenario
        env:
          LOCALITY_LIVE_CONNECTOR: gmail
        run: tests/live_macos_connector_file_provider.sh
      - name: Run real Linear File Provider edit and restore scenario
        env:
          LOCALITY_LIVE_CONNECTOR: linear
        run: tests/live_macos_connector_file_provider.sh

  slack-file-provider-live:
    name: Signed macOS Slack File Provider live e2e
    needs: [file-provider-live, connector-file-provider-live]
    runs-on: [self-hosted, macOS, locality-file-provider]
    timeout-minutes: 30
    environment: connector-live-e2e
    env:
      LOCALITY_SLACK_LIVE_CREDENTIAL_JSON: ${{ secrets.LOCALITY_SLACK_LIVE_CREDENTIAL_JSON }}
      LOCALITY_SLACK_LIVE_CONVERSATION_ID: ${{ secrets.LOCALITY_SLACK_LIVE_CONVERSATION_ID }}
      LOCALITY_SLACK_LIVE_TYPES: ${{ secrets.LOCALITY_SLACK_LIVE_TYPES }}
      LOCALITY_LIVE_CONNECTOR: slack
      LOCALITY_LIVE_FORCE_OAUTH_REFRESH: "1"
      LOCALITY_MACOS_FILE_PROVIDER_APP: ${{ needs.file-provider-live.outputs.app_path }}
      LOCALITY_MACOS_FILE_PROVIDER_EXPECTED_BUNDLE_ID: ${{ needs.file-provider-live.outputs.bundle_id }}
      LOCALITY_MACOS_CONNECTOR_FILE_PROVIDER_LIVE: "1"
      LOCALITY_MACOS_FILE_PROVIDER_DEDICATED_HOST: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Initialize Slack credential rotation path
        run: echo "LOCALITY_LIVE_ROTATED_CREDENTIAL_OUTPUT=$RUNNER_TEMP/locality-slack-macos-credential.json" >> "$GITHUB_ENV"
      - name: Preflight Slack credential rotation
        env:
          GH_TOKEN: ${{ secrets.LOCALITY_SECRET_ROTATOR_TOKEN }}
        run: |
          [ -n "${GH_TOKEN:-}" ] || { echo "::error::LOCALITY_SECRET_ROTATOR_TOKEN is required"; exit 1; }
          gh api "repos/$GITHUB_REPOSITORY/environments/connector-live-e2e/secrets/public-key" >/dev/null
      - name: Run real Slack File Provider read-only scenario
        run: tests/live_macos_connector_file_provider.sh
      - name: Persist refreshed Slack credential after macOS consumer
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ secrets.LOCALITY_SECRET_ROTATOR_TOKEN }}
        run: |
          ROTATED_CREDENTIAL_PATH="${LOCALITY_LIVE_ROTATED_CREDENTIAL_OUTPUT:-}"
          trap 'rm -f "$ROTATED_CREDENTIAL_PATH"' EXIT
          [ -n "${GH_TOKEN:-}" ] || { echo "::error::LOCALITY_SECRET_ROTATOR_TOKEN is required"; exit 1; }
          [ -s "$ROTATED_CREDENTIAL_PATH" ] || { echo "::error::refreshed Slack credential was not exported"; exit 1; }
          gh secret set LOCALITY_SLACK_LIVE_CREDENTIAL_JSON \
            --repo "$GITHUB_REPOSITORY" \
            --env connector-live-e2e \
            < "$ROTATED_CREDENTIAL_PATH"

  granola-file-provider-live:
    name: Signed macOS Granola File Provider live e2e
    needs: [file-provider-live, slack-file-provider-live]
    runs-on: [self-hosted, macOS, locality-file-provider]
    timeout-minutes: 30
    environment: granola-live-e2e
    env:
      GRANOLA_API_KEY: ${{ secrets.GRANOLA_API_KEY }}
      LOCALITY_GRANOLA_LIVE_NOTE_ID: ${{ secrets.LOCALITY_GRANOLA_LIVE_NOTE_ID }}
      LOCALITY_LIVE_CONNECTOR: granola
      LOCALITY_MACOS_FILE_PROVIDER_APP: ${{ needs.file-provider-live.outputs.app_path }}
      LOCALITY_MACOS_FILE_PROVIDER_EXPECTED_BUNDLE_ID: ${{ needs.file-provider-live.outputs.bundle_id }}
      LOCALITY_MACOS_CONNECTOR_FILE_PROVIDER_LIVE: "1"
      LOCALITY_MACOS_FILE_PROVIDER_DEDICATED_HOST: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Run real Granola File Provider read-only scenario
        run: tests/live_macos_connector_file_provider.sh
