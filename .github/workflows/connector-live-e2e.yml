            sqlite3
      - name: Check live Linear secrets and FUSE device
        shell: bash
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          LOCALITY_LINEAR_LIVE_ISSUE_ID: ${{ secrets.LOCALITY_LINEAR_LIVE_ISSUE_ID }}
        run: |
          missing=()
          [ -n "$LINEAR_API_KEY" ] || missing+=("LINEAR_API_KEY")
          [ -n "$LOCALITY_LINEAR_LIVE_ISSUE_ID" ] || missing+=("LOCALITY_LINEAR_LIVE_ISSUE_ID")
          if [ "${#missing[@]}" -gt 0 ]; then
