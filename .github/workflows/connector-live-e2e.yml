name: connector-live-e2e

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/connector-live-e2e.yml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/locality-connector/**"
      - "crates/locality-core/**"
      - "crates/locality-store/**"
      - "crates/localityd/**"
      - "crates/loc-cli/**"
      - "crates/locality-google-docs/**"
      - "crates/locality-google-calendar/**"
      - "crates/locality-gmail/**"
      - "crates/locality-slack/**"
      - "crates/locality-linear/**"
      - "platform/linux/locality-fuse/**"
      - "tests/live_connector_common.sh"
      - "tests/live_google_docs_vfs_roundtrip.sh"
      - "tests/live_google_calendar_vfs_roundtrip.sh"
      - "tests/live_gmail_vfs_roundtrip.sh"
      - "tests/live_slack_vfs_read.sh"
      - "tests/live_linear_vfs_roundtrip.sh"
  schedule:
    - cron: "17 14 * * 3"
  workflow_dispatch:

concurrency:
  group: connector-live-e2e
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  google-docs-live:
    name: Google Docs Linux FUSE live e2e
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: connector-live-e2e
    env:
      LOCALITY_GOOGLE_DOCS_LIVE_CREDENTIAL_JSON: ${{ secrets.LOCALITY_GOOGLE_DOCS_LIVE_CREDENTIAL_JSON }}
      LOCALITY_GOOGLE_DOCS_LIVE_WORKSPACE_FOLDER: ${{ secrets.LOCALITY_GOOGLE_DOCS_LIVE_WORKSPACE_FOLDER }}
      LOCALITY_LIVE_GOOGLE_DOCS_VFS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install FUSE dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            fuse3 \
            libfuse3-dev \
            libglib2.0-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            pkg-config \
            sqlite3
      - name: Check live Google Docs secrets and FUSE device
        shell: bash
        run: |
          missing=()
          [ -n "$LOCALITY_GOOGLE_DOCS_LIVE_CREDENTIAL_JSON" ] || missing+=("LOCALITY_GOOGLE_DOCS_LIVE_CREDENTIAL_JSON")
          [ -n "$LOCALITY_GOOGLE_DOCS_LIVE_WORKSPACE_FOLDER" ] || missing+=("LOCALITY_GOOGLE_DOCS_LIVE_WORKSPACE_FOLDER")
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Google Docs live e2e missing required environment secrets: ${missing[*]}"
            exit 1
          fi
          if [ ! -e /dev/fuse ]; then
            echo "::error::/dev/fuse is unavailable; the live connector Linux FUSE e2e cannot run"
            exit 1
          fi
      - name: Run live Google Docs Linux FUSE e2e
        run: tests/live_google_docs_vfs_roundtrip.sh

